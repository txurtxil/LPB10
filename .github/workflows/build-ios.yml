name: Build iOS IPA (Coste 0)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Compila los bundles de iOS en modo release sin firma
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      # Construye el Payload empaquetando adecuadamente la estructura de iOS
      - name: Create IPA Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r lmb10-unsigned.ipa Payload

      # Sube el archivo .ipa generado
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmb10-ios-build
          path: build/ios/iphoneos/lmb10-unsigned.ipa
