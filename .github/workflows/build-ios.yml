name: Build iOS IPA (Coste 0)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Cablea el target LmBatteryWidget en el proyecto Xcode (v161):
      # el script es idempotente y la gema xcodeproj viene con CocoaPods
      # (preinstalada en los runners macos-latest).
      - name: Wire iOS widget extension target
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --user-install
          ruby tool/ios_add_widget_target.rb
          xcodebuild -list -project ios/Runner.xcodeproj | grep LmBatteryWidget

      # Compila los bundles de iOS en modo release sin firma
      # flutter build ios --no-codesign falla de forma intermitente con la
      # extension del widget (LmBatteryWidget): xcodebuild termina OK pero
      # flutter_tools exige Development Team despues ("Building a deployable
      # iOS app requires..."). v255-v260 fallaron asi; v249-v254 pasaron
      # con el mismo arbol/imagen/flutter. Fix: --config-only solo prepara
      # (podfile, pod install, xcconfig) y compilamos con xcodebuild directo
      # con el signing desactivado a bajo nivel (sin check de flutter_tools).
      - name: Prepare iOS build (pod install + config)
        run: flutter build ios --release --no-codesign --config-only

      - name: Build iOS App
        run: |
          set -e
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/xc \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p build/ios/iphoneos
          cp -R build/xc/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/

      # Construye el Payload empaquetando adecuadamente la estructura de iOS
      # La extension del widget debe viajar dentro de Runner.app/PlugIns
      - name: Verify widget extension bundled
        run: ls build/ios/iphoneos/Runner.app/PlugIns/LmBatteryWidget.appex

      - name: Create IPA Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r lmb10-unsigned.ipa Payload

      # Sube el .ipa como artifact (sirve para pruebas sueltas con workflow_dispatch)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmb10-ios-build
          path: build/ios/iphoneos/lmb10-unsigned.ipa

      # Si el disparo viene de una release publicada, sube el .ipa a esa misma release
      - name: Upload IPA to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/ios/iphoneos/lmb10-unsigned.ipa "lmb10-${{ github.event.release.tag_name }}-unsigned.ipa"
          gh release upload "${{ github.event.release.tag_name }}" "lmb10-${{ github.event.release.tag_name }}-unsigned.ipa" --repo ${{ github.repository }}
