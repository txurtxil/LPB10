name: Build iOS IPA (Coste 0)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS IPA
        run: flutter build ipa --no-codesign

      # Encuentra el .ipa generado sin importar la subcarpeta exacta y lo sube
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmb10-ios-build
          path: build/ios/**/*.ipa
