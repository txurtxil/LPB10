name: lmb10
description: "Leapmotor B10 Client mTLS"
publish_to: 'none'
version: 3.60.107+251

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.2.0
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  home_widget: ^0.9.3
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  path_provider: ^2.1.6
  geolocator: ^14.0.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  file_selector: ^1.1.0
  google_sign_in: ^7.2.0
flutter:
  generate: true
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121018"
  adaptive_icon_foreground: "assets/icon/icon.png"
